name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Start check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Start the real app, let it draw and save a picture, then close.
          # Fails if the window can't open.
          $p = Start-Process target/release/thinkcraft.exe -ArgumentList '--screenshot', "$env:RUNNER_TEMP\start.png" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "ThinkCraft didn't finish starting within 90 seconds" }
          if (-not (Test-Path "$env:RUNNER_TEMP\start.png")) {
            Get-Content "$env:APPDATA\ThinkCraft\error.log" -ErrorAction SilentlyContinue
            throw "ThinkCraft didn't open its window (exit code $($p.ExitCode))"
          }
          Write-Host "ThinkCraft started and drew its window."

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/thinkcraft.exe dist/ThinkCraft.exe
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath thinkcraft-${{ matrix.name }}.zip -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          sh make-mac-app.sh
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist && ditto -c -k --keepParent ThinkCraft.app ../thinkcraft-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: thinkcraft-${{ matrix.name }}
          path: thinkcraft-${{ matrix.name }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: thinkcraft-${{ matrix.name }}.zip
